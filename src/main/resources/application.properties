# =========================================================
# SMARTBIZ - Configuration principale
# Toutes les valeurs sensibles viennent de variables d'environnement.
# Pour le developpement local, copiez application-local.properties.example
# vers application-local.properties et activez le profil "local".
# =========================================================

spring.application.name=smartbiz

# ---------- Base de donnees PostgreSQL ----------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/smartbiz}
spring.datasource.username=${DATABASE_USERNAME:smartbiz_user}
spring.datasource.password=${DATABASE_PASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.batch_size=30
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ---------- Google OAuth2 ----------
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# ---------- Mail (SMTP) ----------
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:smartbiz}
spring.mail.password=${SMTP_PASSWORD:kppz yhkn idle svjv}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------- Upload de fichiers (photos, imports Excel) ----------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
smartbiz.upload.dir=${UPLOAD_DIR:./uploads}

# ---------- Thymeleaf ----------
spring.thymeleaf.cache=${THYMELEAF_CACHE:true}

# ---------- Serveur ----------
server.port=${SERVER_PORT:8080}
server.error.whitelabel.enabled=false

# ---------- Securite session ----------
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ---------- Logging ----------
logging.level.com.smartbiz=INFO
logging.level.org.hibernate.SQL=WARN
