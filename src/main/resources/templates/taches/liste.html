<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tâches — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title">
            <h1><i class="bi bi-list-task me-2"></i>Toutes les tâches</h1>
            <p class="text-muted">Vue globale, tous projets confondus. Pour gérer une tâche (glisser-déposer, statut), ouvrez son projet.</p>
        </div>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr><th>Titre</th><th>Projet</th><th>Responsable</th><th>Priorité</th><th>Statut</th><th>Échéance</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(taches)}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune tâche pour l'instant.
                        </td>
                    </tr>
                    <tr th:each="t : ${taches}">
                        <td th:text="${t.titre}">Titre</td>
                        <td><a th:href="@{/projets/{id}(id=${t.projet.id})}" th:text="${t.projet.nom}">Projet</a></td>
                        <td th:text="${t.responsable != null ? t.responsable.prenom + ' ' + t.responsable.nom : '—'}">—</td>
                        <td><span class="badge sb-badge-statut" th:text="${t.priorite}">NORMALE</span></td>
                        <td><span class="badge sb-badge-statut" th:text="${t.statut}">A_FAIRE</span></td>
                        <td th:text="${t.dateLimite ?: '—'}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
