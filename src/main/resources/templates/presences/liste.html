<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Présences — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-clock-history me-2"></i>Présences</h1>
            </div>
            <a th:href="@{/presences/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Enregistrer une présence</a>
        </div>

        <form method="get" th:action="@{/presences}" class="sb-panel sb-filters mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-3">
                    <label class="form-label small">Date</label>
                    <input type="date" name="date" th:value="${date}" class="form-control" onchange="this.form.submit()">
                </div>
            </div>
        </form>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr><th>Employe</th><th>Statut</th><th>Arrivee</th><th>Depart</th><th>Notes</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${presencesPage.empty}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune presence enregistree pour cette date.
                        </td>
                    </tr>
                    <tr th:each="p : ${presencesPage.content}">
                        <td th:text="${p.employe.prenom + ' ' + p.employe.nom}">Employe</td>
                        <td><span class="badge sb-badge-statut" th:text="${p.statut}">PRESENT</span></td>
                        <td th:text="${p.heureArrivee ?: '—'}">—</td>
                        <td th:text="${p.heureDepart ?: '—'}">—</td>
                        <td th:text="${p.notes ?: '—'}">—</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${presencesPage}, '/presences')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
