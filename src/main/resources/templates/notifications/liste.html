<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Notifications — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title">
            <h1><i class="bi bi-bell me-2"></i>Notifications</h1>
        </div>

        <div class="sb-panel p-0">
            <div class="list-group list-group-flush">
                <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted py-5">
                    <i class="bi bi-bell-slash fs-1 d-block mb-2"></i>Aucune notification.
                </div>
                <a th:each="n : ${notifications}" th:href="${n.lien ?: '#'}"
                   class="list-group-item list-group-item-action" th:classappend="${n.lue} ? '' : 'fw-semibold'">
                    <div class="d-flex justify-content-between">
                        <span th:text="${n.message}">Message</span>
                        <span class="badge sb-badge-statut" th:text="${n.type}">TYPE</span>
                    </div>
                    <div class="text-muted small" th:text="${n.dateCreation}">Date</div>
                </a>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
