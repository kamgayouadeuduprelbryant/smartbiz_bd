<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouveau projet — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title"><h1>Nouveau projet</h1></div>

        <form class="sb-panel" method="post" th:action="@{/projets}" th:object="${projetDto}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <input type="text" th:field="*{nom}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date de debut</label>
                    <input type="date" th:field="*{dateDebut}" class="form-control">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date d'echeance</label>
                    <input type="date" th:field="*{dateEcheance}" class="form-control">
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>
                <div class="col-12">
                    <label class="form-label">Membres</label>
                    <select th:field="*{membreIds}" class="form-select" multiple size="6">
                        <option th:each="e : ${employes}" th:value="${e.id}" th:text="${e.prenom + ' ' + e.nom}"></option>
                    </select>
                    <div class="form-text">Maintenez Ctrl (ou Cmd) pour selectionner plusieurs membres.</div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Creer le projet</button>
                <a th:href="@{/projets}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
