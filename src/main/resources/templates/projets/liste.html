<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Projets — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-kanban me-2"></i>Projets</h1>
            </div>
            <a th:href="@{/projets/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouveau projet</a>
        </div>

        <div class="row g-3">
            <div class="col-md-6 col-lg-4" th:each="p : ${projets}">
                <div class="sb-panel h-100">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5><a th:href="@{/projets/{id}(id=${p.id})}" th:text="${p.nom}">Projet</a></h5>
                        <span class="badge sb-badge-statut" th:text="${p.statut}">PLANIFIE</span>
                    </div>
                    <p class="text-muted small" th:text="${p.description ?: 'Pas de description'}">Description</p>
                    <div class="progress mb-1" style="height: 6px;">
                        <div class="progress-bar" role="progressbar" th:style="'width: ' + ${p.progression} + '%'"></div>
                    </div>
                    <div class="d-flex justify-content-between text-muted small">
                        <span th:text="${p.progression} + '% termine'">0%</span>
                        <span th:text="${#lists.size(p.taches)} + ' tache(s)'">0 tache(s)</span>
                    </div>
                </div>
            </div>
            <div class="col-12" th:if="${#lists.isEmpty(projets)}">
                <div class="sb-panel text-center text-muted py-5">
                    <i class="bi bi-kanban fs-1 d-block mb-2"></i>Aucun projet pour l'instant.
                </div>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
