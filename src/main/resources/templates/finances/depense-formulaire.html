<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nouvelle depense — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title"><h1>Nouvelle depense</h1></div>

        <form class="sb-panel" method="post" th:action="@{/finances/depenses}" th:object="${depense}">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Libelle</label>
                    <input type="text" th:field="*{libelle}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('libelle')}" th:errors="*{libelle}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Montant</label>
                    <input type="number" step="0.01" th:field="*{montant}" class="form-control" required>
                    <div class="text-danger small" th:if="${#fields.hasErrors('montant')}" th:errors="*{montant}"></div>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date</label>
                    <input type="date" th:field="*{date}" class="form-control">
                </div>
                <div class="col-md-6">
                    <label class="form-label">Categorie</label>
                    <select th:field="*{categorie}" class="form-select">
                        <option th:each="c : ${categories}" th:value="${c}" th:text="${c}"></option>
                    </select>
                </div>
                <div class="col-12">
                    <label class="form-label">Description</label>
                    <textarea th:field="*{description}" class="form-control" rows="2"></textarea>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
                <a th:href="@{/finances/depenses}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
