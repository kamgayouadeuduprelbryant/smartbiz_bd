<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Depenses — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/finances}">Finances</a></li>
                <li class="breadcrumb-item active">Depenses</li>
            </ol>
        </nav>

        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <h1><i class="bi bi-graph-down me-2"></i>Depenses</h1>
            <a th:href="@{/finances/depenses/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouvelle depense</a>
        </div>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr><th>Date</th><th>Libelle</th><th>Categorie</th><th>Montant</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${depensesPage.empty}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune depense enregistree.
                        </td>
                    </tr>
                    <tr th:each="d : ${depensesPage.content}">
                        <td th:text="${d.date}">2026-01-01</td>
                        <td th:text="${d.libelle}">Libelle</td>
                        <td><span class="badge sb-badge-statut" th:text="${d.categorie}">AUTRE</span></td>
                        <td th:text="${d.montant}">0.00</td>
                        <td class="text-end">
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="'#suppr' + ${d.id}"><i class="bi bi-trash"></i></button>
                            <div th:replace="~{fragments/confirmation-suppression :: modal('suppr' + ${d.id}, @{/finances/depenses/{id}/supprimer(id=${d.id})}, 'Supprimer cette depense ?')}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${depensesPage}, '/finances/depenses')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
