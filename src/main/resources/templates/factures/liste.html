<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Factures — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-receipt me-2"></i>Factures</h1>
            </div>
            <a th:href="@{/factures/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouvelle facture</a>
        </div>

        <form method="get" th:action="@{/factures}" class="sb-panel sb-filters mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small">Statut</label>
                    <select name="statut" class="form-select">
                        <option value="">Tous</option>
                        <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}" th:selected="${s == statut}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-funnel me-1"></i>Filtrer</button>
                </div>
            </div>
        </form>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Numero</th>
                        <th>Client</th>
                        <th>Emission</th>
                        <th>Total</th>
                        <th>Reste a payer</th>
                        <th>Statut</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${facturesPage.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune facture trouvee.
                        </td>
                    </tr>
                    <tr th:each="f : ${facturesPage.content}">
                        <td><a th:href="@{/factures/{id}(id=${f.id})}" th:text="${f.numero}">FAC-000001</a></td>
                        <td th:text="${f.client.nom}">Client</td>
                        <td th:text="${f.dateEmission}">2026-01-01</td>
                        <td th:text="${f.total}">0.00</td>
                        <td th:text="${f.resteAPayer}">0.00</td>
                        <td><span class="badge sb-badge-statut" th:text="${f.statut}">BROUILLON</span></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${facturesPage}, '/factures')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
