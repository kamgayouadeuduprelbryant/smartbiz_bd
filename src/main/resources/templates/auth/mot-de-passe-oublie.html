<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Mot de passe oublie — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="sb-auth-body">

<div class="sb-auth-card">
    <div class="sb-auth-brand">
        <i class="bi bi-diagram-3-fill"></i>
        <span>SmartBiz</span>
    </div>
    <p class="sb-auth-slogan">Reinitialiser votre mot de passe</p>

    <form method="post" th:action="@{/auth/mot-de-passe-oublie}" class="mt-3">
        <div class="mb-3">
            <label class="form-label">Adresse email</label>
            <input type="email" name="email" class="form-control" placeholder="vous@entreprise.com" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Envoyer le lien de reinitialisation</button>
    </form>

    <div class="sb-auth-links">
        <a th:href="@{/auth/login}">Retour a la connexion</a>
    </div>
</div>

</body>
</html>
