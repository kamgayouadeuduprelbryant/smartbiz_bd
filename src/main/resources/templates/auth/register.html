<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inscription — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body class="sb-auth-body">

<div class="sb-auth-card">
    <div class="sb-auth-brand">
        <i class="bi bi-diagram-3-fill"></i>
        <span>SmartBiz</span>
    </div>
    <p class="sb-auth-slogan">Creer votre compte</p>

    <div th:if="${erreur}" class="alert alert-danger py-2" th:text="${erreur}">Erreur</div>

    <form th:action="@{/auth/register}" th:object="${registerRequest}" method="post" class="mt-3">
        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">Prenom</label>
                <input type="text" th:field="*{prenom}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('prenom')}" th:errors="*{prenom}"></div>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Nom</label>
                <input type="text" th:field="*{nom}" class="form-control" required>
                <div class="text-danger small" th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}"></div>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">Adresse email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>
        <div class="mb-3">
            <label class="form-label">Mot de passe</label>
            <input type="password" th:field="*{motDePasse}" class="form-control" required>
            <div class="text-danger small" th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}"></div>
        </div>
        <button type="submit" class="btn btn-primary w-100">Creer mon compte</button>
    </form>

    <div class="sb-auth-links">
        <a th:href="@{/auth/login}">J'ai deja un compte</a>
    </div>
</div>

</body>
</html>
