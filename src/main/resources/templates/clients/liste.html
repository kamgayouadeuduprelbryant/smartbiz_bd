<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clients — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-person-vcard me-2"></i>Clients</h1>
                <p class="text-muted">Portefeuille clients de l'entreprise</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/clients/import}" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-arrow-up me-1"></i>Importer Excel</a>
                <a th:href="@{/clients/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouveau client</a>
            </div>
        </div>

        <form method="get" th:action="@{/clients}" class="sb-panel sb-filters mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label small">Recherche</label>
                    <input type="text" name="recherche" th:value="${recherche}" class="form-control" placeholder="Nom, email, ville...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Statut</label>
                    <select name="actif" class="form-select">
                        <option value="">Tous</option>
                        <option value="true" th:selected="${actif != null and actif}">Actif</option>
                        <option value="false" th:selected="${actif != null and !actif}">Inactif</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-funnel me-1"></i>Filtrer</button>
                </div>
            </div>
        </form>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Nom</th>
                        <th>Email</th>
                        <th>Telephone</th>
                        <th>Ville</th>
                        <th>Statut</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${clientsPage.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun client trouve.
                        </td>
                    </tr>
                    <tr th:each="c : ${clientsPage.content}">
                        <td><a th:href="@{/clients/{id}(id=${c.id})}" th:text="${c.nom}">Nom</a></td>
                        <td th:text="${c.email ?: '—'}">Email</td>
                        <td th:text="${c.telephone ?: '—'}">Tel</td>
                        <td th:text="${c.ville ?: '—'}">Ville</td>
                        <td>
                            <span class="badge" th:classappend="${c.actif} ? 'sb-statut-ACTIF' : 'sb-statut-LICENCIE'" th:text="${c.actif} ? 'Actif' : 'Inactif'">Actif</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/clients/{id}/modifier(id=${c.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="'#suppr' + ${c.id}"><i class="bi bi-trash"></i></button>
                            <div th:replace="~{fragments/confirmation-suppression :: modal('suppr' + ${c.id}, @{/clients/{id}/supprimer(id=${c.id})}, 'Supprimer le client ' + ${c.nom} + ' ?')}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${clientsPage}, '/clients')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/recherche.js}"></script>
</body>
</html>
