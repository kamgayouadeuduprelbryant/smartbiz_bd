<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Employes — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-people me-2"></i>Employes</h1>
                <p class="text-muted">Gestion du personnel de l'entreprise</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/employes/import}" class="btn btn-outline-secondary"><i class="bi bi-file-earmark-arrow-up me-1"></i>Importer Excel</a>
                <a th:href="@{/employes/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouvel employe</a>
            </div>
        </div>

        <form method="get" th:action="@{/employes}" class="sb-panel sb-filters mb-3">
            <div class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small">Recherche</label>
                    <input type="text" name="recherche" th:value="${recherche}" class="form-control" placeholder="Nom, prenom, matricule, email...">
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Departement</label>
                    <select name="departementId" class="form-select">
                        <option value="">Tous</option>
                        <option th:each="d : ${departements}" th:value="${d.id}" th:text="${d.nom}"
                                th:selected="${d.id == departementId}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Statut</label>
                    <select name="statut" class="form-select">
                        <option value="">Tous</option>
                        <option th:each="s : ${T(com.smartbiz.model.StatutEmploye).values()}"
                                th:value="${s}" th:text="${s}" th:selected="${s == statut}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-outline-primary w-100"><i class="bi bi-funnel me-1"></i>Filtrer</button>
                </div>
            </div>
        </form>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Matricule</th>
                        <th>Nom complet</th>
                        <th>Poste</th>
                        <th>Departement</th>
                        <th>Statut</th>
                        <th class="text-end">Actions</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${employesPage.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun employe trouve.
                        </td>
                    </tr>
                    <tr th:each="e : ${employesPage.content}">
                        <td th:text="${e.matricule}">EMP-0001</td>
                        <td>
                            <a th:href="@{/employes/{id}(id=${e.id})}" th:text="${e.prenom + ' ' + e.nom}">Nom Prenom</a>
                        </td>
                        <td th:text="${e.poste}">Poste</td>
                        <td th:text="${e.departement != null ? e.departement.nom : '—'}">Departement</td>
                        <td>
                            <span class="badge sb-badge-statut" th:classappend="'sb-statut-' + ${e.statut}" th:text="${e.statut}">ACTIF</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/employes/{id}/modifier(id=${e.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" th:data-bs-target="'#suppr' + ${e.id}"><i class="bi bi-trash"></i></button>

                            <div th:replace="~{fragments/confirmation-suppression :: modal('suppr' + ${e.id}, @{/employes/{id}/supprimer(id=${e.id})}, 'Supprimer l/employe ' + ${e.prenom} + ' ' + ${e.nom} + ' ?')}"></div>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${employesPage}, '/employes')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/recherche.js}"></script>
</body>
</html>
