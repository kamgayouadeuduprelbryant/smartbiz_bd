<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Journal d'audit — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title">
            <h1><i class="bi bi-clock-history me-2"></i>Journal d'audit</h1>
            <p class="text-muted">Historique des actions importantes réalisées dans SmartBiz</p>
        </div>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr><th>Date</th><th>Utilisateur</th><th>Action</th><th>Entité</th><th>Détail</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${auditPage.empty}">
                        <td colspan="5" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucune activité enregistrée.
                        </td>
                    </tr>
                    <tr th:each="a : ${auditPage.content}">
                        <td th:text="${#temporals.format(a.dateAction, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                        <td th:text="${a.utilisateurEmail}">email</td>
                        <td><span class="badge sb-badge-statut" th:text="${a.action}">CREATION</span></td>
                        <td th:text="${a.entiteConcernee ?: '—'}">Entite</td>
                        <td th:text="${a.description}">Description</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${auditPage}, '/parametres/audit')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
