<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detail fournisseur — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/fournisseurs}">Fournisseurs</a></li>
                <li class="breadcrumb-item active" th:text="${fournisseur.nom}">Detail</li>
            </ol>
        </nav>

        <div class="sb-panel">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <h1 class="h3 mb-1" th:text="${fournisseur.nom}">Nom</h1>
                <span class="badge" th:classappend="${fournisseur.actif} ? 'sb-statut-ACTIF' : 'sb-statut-LICENCIE'" th:text="${fournisseur.actif} ? 'Actif' : 'Inactif'">Actif</span>
            </div>

            <hr>

            <div class="row g-3">
                <div class="col-md-4"><strong>Email</strong><div th:text="${fournisseur.email ?: '—'}">—</div></div>
                <div class="col-md-4"><strong>Telephone</strong><div th:text="${fournisseur.telephone ?: '—'}">—</div></div>
                <div class="col-md-4"><strong>Ville</strong><div th:text="${fournisseur.ville ?: '—'}">—</div></div>
                <div class="col-12"><strong>Adresse</strong><div th:text="${fournisseur.adresse ?: '—'}">—</div></div>
            </div>

            <div class="mt-4">
                <a th:href="@{/fournisseurs/{id}/modifier(id=${fournisseur.id})}" class="btn btn-outline-secondary"><i class="bi bi-pencil me-1"></i>Modifier</a>
                <a th:href="@{/fournisseurs}" class="btn btn-link">Retour a la liste</a>
            </div>
        </div>

        <div class="sb-panel">
            <h5><i class="bi bi-box-seam me-2"></i>Produits fournis</h5>
            <ul class="list-group list-group-flush" th:if="${not #lists.isEmpty(fournisseur.produits)}">
                <li class="list-group-item d-flex justify-content-between" th:each="p : ${fournisseur.produits}">
                    <a th:href="@{/produits/{id}/modifier(id=${p.id})}" th:text="${p.nom}">Produit</a>
                    <span class="text-muted" th:text="${p.reference}">REF</span>
                </li>
            </ul>
            <p class="text-muted small mb-0" th:if="${#lists.isEmpty(fournisseur.produits)}">Aucun produit associe pour l'instant.</p>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
