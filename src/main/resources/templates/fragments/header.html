<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<header th:fragment="header" class="sb-header" th:data-csrf-token="${_csrf.token}" th:data-csrf-header="${_csrf.headerName}">
    <button class="btn sb-burger d-lg-none" type="button" data-bs-toggle="offcanvas" data-bs-target="#sbSidebar">
        <i class="bi bi-list"></i>
    </button>

    <form class="sb-search" role="search" onsubmit="return false;">
        <i class="bi bi-search"></i>
        <input id="rechercheGlobale" type="search" placeholder="Rechercher un employe, client, facture..." autocomplete="off">
        <div id="rechercheResultats" class="sb-search-results d-none"></div>
    </form>

    <div class="sb-header-actions">
        <div class="dropdown">
            <button class="btn sb-icon-btn position-relative" type="button" data-bs-toggle="dropdown">
                <i class="bi bi-bell"></i>
                <span id="notifBadge" class="badge rounded-pill bg-danger sb-badge d-none">0</span>
            </button>
            <div class="dropdown-menu dropdown-menu-end sb-dropdown-panel">
                <h6 class="dropdown-header">Notifications</h6>
                <div id="notifList" class="text-muted small px-3 py-2">Aucune nouvelle notification.</div>
                <div class="dropdown-divider"></div>
                <a class="dropdown-item text-center small" href="/notifications">Voir toutes les notifications</a>
            </div>
        </div>

        <div class="dropdown">
            <button class="btn sb-user-btn" type="button" data-bs-toggle="dropdown">
                <span class="sb-avatar" sec:authentication="name">U</span>
                <span class="d-none d-md-inline" sec:authentication="name">Utilisateur</span>
                <i class="bi bi-chevron-down"></i>
            </button>
            <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="/parametres/profil"><i class="bi bi-person me-2"></i>Mon profil</a></li>
                <li><a class="dropdown-item" href="/parametres/mot-de-passe"><i class="bi bi-key me-2"></i>Changer le mot de passe</a></li>
                <li><hr class="dropdown-divider"></li>
                <li>
                    <form th:action="@{/auth/logout}" method="post">
                        <button type="submit" class="dropdown-item text-danger"><i class="bi bi-box-arrow-right me-2"></i>Deconnexion</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>

    <script th:src="@{/js/notifications.js}"></script>
</header>

</body>
</html>
