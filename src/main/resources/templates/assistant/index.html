<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Assistant SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title">
            <h1><i class="bi bi-stars me-2"></i>Assistant SmartBiz</h1>
            <p class="text-muted">Posez une question sur votre activité — l'assistant s'appuie sur vos données réelles.</p>
        </div>

        <div class="sb-panel">
            <div id="assistantFil" style="min-height: 260px; max-height: 420px; overflow-y: auto;">
                <div class="d-flex mb-3">
                    <div class="bg-body-secondary rounded p-3" style="max-width: 75%;">
                        Bonjour ! Posez-moi une question, par exemple :
                        <ul class="mb-0 mt-2">
                            <li th:each="s : ${suggestions}">
                                <a href="#" class="assistant-suggestion" th:text="${s}">Suggestion</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

            <form id="assistantForm" class="d-flex gap-2 mt-3">
                <input type="text" id="assistantQuestion" class="form-control" placeholder="Posez votre question..." autocomplete="off">
                <button type="submit" class="btn btn-primary"><i class="bi bi-send"></i></button>
            </form>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/assistant.js}"></script>
</body>
</html>
