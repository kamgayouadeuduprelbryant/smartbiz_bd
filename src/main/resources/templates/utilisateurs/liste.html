<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Utilisateurs — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title">
            <h1><i class="bi bi-person-gear me-2"></i>Utilisateurs</h1>
            <p class="text-muted">Gestion des comptes et des rôles</p>
        </div>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr><th>Nom</th><th>Email</th><th>Rôles</th><th>Connexion</th><th>Statut</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:each="u : ${utilisateurs}">
                        <td th:text="${u.prenom + ' ' + u.nom}">Nom</td>
                        <td th:text="${u.email}">email</td>
                        <td>
                            <span class="badge sb-badge-statut me-1" th:each="r : ${u.roles}" th:text="${r.nom}">ROLE</span>
                        </td>
                        <td th:text="${u.compteGoogle} ? 'Google' : 'Mot de passe'">Mot de passe</td>
                        <td>
                            <span class="badge" th:classappend="${u.actif} ? 'sb-statut-ACTIF' : 'sb-statut-LICENCIE'" th:text="${u.actif} ? 'Actif' : 'Inactif'">Actif</span>
                        </td>
                        <td class="text-end">
                            <a th:href="@{/utilisateurs/{id}/modifier(id=${u.id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-pencil"></i></a>
                            <form method="post" th:action="@{/utilisateurs/{id}/basculer-activation(id=${u.id})}" class="d-inline">
                                <button type="submit" class="btn btn-sm" th:classappend="${u.actif} ? 'btn-outline-danger' : 'btn-outline-success'">
                                    <i class="bi" th:classappend="${u.actif} ? 'bi-lock' : 'bi-unlock'"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
