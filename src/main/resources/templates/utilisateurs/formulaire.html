<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modifier l'utilisateur — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title"><h1>Modifier l'utilisateur</h1></div>

        <form class="sb-panel" method="post" th:action="@{/utilisateurs/{id}(id=${utilisateurDto.id})}" th:object="${utilisateurDto}">
            <input type="hidden" th:field="*{id}">

            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Nom</label>
                    <input type="text" th:field="*{nom}" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Prénom</label>
                    <input type="text" th:field="*{prenom}" class="form-control" required>
                </div>
                <div class="col-12">
                    <label class="form-label">Email</label>
                    <input type="email" th:field="*{email}" class="form-control" readonly>
                    <div class="form-text">L'email ne peut pas être modifié depuis cet écran.</div>
                </div>
                <div class="col-12">
                    <label class="form-label">Rôles</label>
                    <select th:field="*{roleIds}" class="form-select" multiple size="6">
                        <option th:each="r : ${roles}" th:value="${r.id}" th:text="${r.nom}"></option>
                    </select>
                    <div class="form-text">Maintenez Ctrl (ou Cmd) pour sélectionner plusieurs rôles.</div>
                </div>
                <div class="col-12">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" th:field="*{actif}">
                        <label class="form-check-label">Compte actif</label>
                    </div>
                </div>
            </div>

            <div class="mt-4 d-flex gap-2">
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Enregistrer</button>
                <a th:href="@{/utilisateurs}" class="btn btn-outline-secondary">Annuler</a>
            </div>
        </form>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
