<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Commande — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a th:href="@{/commandes}">Commandes</a></li>
                <li class="breadcrumb-item active" th:text="${commande.numero}">CMD-000001</li>
            </ol>
        </nav>

        <div class="alert alert-danger" th:if="${erreur}" th:text="${erreur}">Erreur</div>

        <div class="sb-panel">
            <div class="d-flex justify-content-between align-items-start flex-wrap gap-2">
                <div>
                    <h1 class="h3 mb-1" th:text="${commande.numero}">CMD-000001</h1>
                    <p class="text-muted mb-0">Client : <a th:href="@{/clients/{id}(id=${commande.client.id})}" th:text="${commande.client.nom}">Client</a> — <span th:text="${commande.dateCommande}">2026-01-01</span></p>
                </div>
                <span class="badge sb-badge-statut fs-6" th:text="${commande.statut}">EN_ATTENTE</span>
            </div>
            <p class="mt-2" th:if="${commande.notes}" th:text="${commande.notes}">Notes</p>

            <form method="post" th:action="@{/commandes/{id}/statut(id=${commande.id})}" class="d-flex gap-2 align-items-end mt-3">
                <div>
                    <label class="form-label small">Changer le statut</label>
                    <select name="statut" class="form-select">
                        <option th:each="s : ${statuts}" th:value="${s}" th:text="${s}" th:selected="${s == commande.statut}"></option>
                    </select>
                </div>
                <button type="submit" class="btn btn-outline-primary">Appliquer</button>
            </form>
        </div>

        <div class="sb-panel">
            <h5>Lignes de commande</h5>
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr><th>Produit</th><th>Quantite</th><th>Prix unitaire</th><th>Sous-total</th><th class="text-end">Actions</th></tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.isEmpty(commande.lignes)}">
                        <td colspan="5" class="text-center text-muted py-3">Aucune ligne pour l'instant.</td>
                    </tr>
                    <tr th:each="l : ${commande.lignes}">
                        <td th:text="${l.produit.nom}">Produit</td>
                        <td th:text="${l.quantite}">1</td>
                        <td th:text="${l.prixUnitaire}">0.00</td>
                        <td th:text="${l.sousTotal}">0.00</td>
                        <td class="text-end">
                            <form method="post" th:action="@{/commandes/{id}/lignes/{ligneId}/supprimer(id=${commande.id},ligneId=${l.id})}">
                                <button type="submit" class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    </tbody>
                    <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">Total</th>
                        <th th:text="${commande.total}">0.00</th>
                        <th></th>
                    </tr>
                    </tfoot>
                </table>
            </div>

            <hr>

            <form method="post" th:action="@{/commandes/{id}/lignes(id=${commande.id})}" th:object="${ligneDto}" class="row g-2 align-items-end">
                <div class="col-md-6">
                    <label class="form-label small">Ajouter un produit</label>
                    <select th:field="*{produitId}" class="form-select" required>
                        <option value="">Choisir un produit</option>
                        <option th:each="p : ${produits}" th:value="${p.id}" th:text="${p.nom + ' — ' + p.prixVente}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label small">Quantite</label>
                    <input type="number" min="1" th:field="*{quantite}" class="form-control" required>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-lg me-1"></i>Ajouter</button>
                </div>
            </form>
        </div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
