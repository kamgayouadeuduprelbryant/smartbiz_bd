<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Stock — SmartBiz</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="sb-body">

<div th:replace="~{fragments/sidebar :: sidebar}"></div>

<div class="sb-main">
    <div th:replace="~{fragments/header :: header}"></div>

    <main class="sb-content">
        <div class="sb-page-title d-flex justify-content-between align-items-center flex-wrap gap-2">
            <div>
                <h1><i class="bi bi-boxes me-2"></i>Mouvements de stock</h1>
                <p class="text-muted">Historique des entrees et sorties</p>
            </div>
            <div class="d-flex gap-2">
                <a th:href="@{/stock/alertes}" class="btn btn-outline-warning"><i class="bi bi-exclamation-triangle me-1"></i>Alertes</a>
                <a th:href="@{/stock/nouveau}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>Nouveau mouvement</a>
            </div>
        </div>

        <div class="sb-panel p-0">
            <div class="table-responsive">
                <table class="table sb-table align-middle mb-0">
                    <thead>
                    <tr>
                        <th>Date</th>
                        <th>Produit</th>
                        <th>Type</th>
                        <th>Quantite</th>
                        <th>Motif</th>
                        <th>Utilisateur</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${mouvementsPage.empty}">
                        <td colspan="6" class="text-center text-muted py-4">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>Aucun mouvement enregistre.
                        </td>
                    </tr>
                    <tr th:each="m : ${mouvementsPage.content}">
                        <td th:text="${#temporals.format(m.dateMouvement, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                        <td th:text="${m.produit.nom}">Produit</td>
                        <td>
                            <span class="badge" th:classappend="${m.type.name() == 'ENTREE'} ? 'sb-statut-ACTIF' : 'sb-statut-SUSPENDU'" th:text="${m.type}">ENTREE</span>
                        </td>
                        <td th:text="${m.quantite}">0</td>
                        <td th:text="${m.motif ?: '—'}">Motif</td>
                        <td th:text="${m.utilisateurEmail}">email</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <div class="mt-3" th:replace="~{fragments/pagination :: pagination(${mouvementsPage}, '/stock')}"></div>
    </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
